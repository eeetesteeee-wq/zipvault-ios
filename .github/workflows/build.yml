name: Build IPA from ZIP

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack project ZIP
        run: |
          set -e
          # Берём ZIP, который загружали последним
          Z=$(git log -1 --name-only --diff-filter=AM --pretty=format: -- '*.zip' | grep -v '^$' | head -n 1 || true)
          if [ -z "$Z" ]; then Z=$(ls -1 *.zip | head -n 1); fi
          echo "Using: $Z"
          ls -la
          df -h . | tail -n 1
          mkdir -p project
          ditto -x -k "$Z" project
          D=$(dirname "$(find project -name project.yml | head -n 1)")
          echo "Project dir: $D"
          ls -la "$D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild \
            -project ZipVault.xcodeproj \
            -scheme ZipVault \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ZipVault.app Payload/
          zip -qry ZipVault.ipa Payload
          ls -la ZipVault.ipa

      - name: Publish IPA to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Архиватор iOS, сборка ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/ZipVault.ipa
